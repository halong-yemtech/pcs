<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCS Operations · Signed out</title><link rel="icon" href="/app/logo.png">
<style>
:root{--bg:#f4f6f8;--card:#fff;--fg:#14181f;--mut:#5b6472;--acc:#1c5a9c}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--fg:#e8ebf0;--mut:#9aa3b0;--acc:#7fb2ee}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
.card{background:var(--card);border-radius:14px;padding:32px;max-width:420px;width:100%;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
img{width:72px;height:72px;border-radius:50%;background:#fff}h1{font-size:20px;margin:12px 0 4px}p{color:var(--mut);margin:0 0 20px}
a{display:inline-block;background:var(--acc);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600}
</style></head><body>
<div class="card"><img src="/app/logo.png" alt="PCS"><h1>PCS Operations</h1><p id="msg">You are signed out.</p><a href="/api/auth/login">Sign in</a></div>
<script>const r=new URLSearchParams(location.search).get('reason');if(r)document.getElementById('msg').textContent=r;</script>
</body></html>
