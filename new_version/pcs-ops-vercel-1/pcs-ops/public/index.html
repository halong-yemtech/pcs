.dts{display:flex;gap:3px}
.dt{font-size:10px;font-weight:700;letter-spacing:.02em;padding:1px 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.dt.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sidetools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.specrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 32px;gap:6px;margin-bottom:6px}
.grp{position:sticky;top:0;z-index:1;background:var(--sunk);border-bottom:1px solid var(--line);padding:6px 12px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mxwrap{max-height:70vh;overflow:auto}
.mx2{font-size:12.5px}
.mx2 thead th{position:sticky;top:0;z-index:2}
.mx2 .stk{position:sticky;left:0;z-index:1;background:var(--surface);border-right:1px solid var(--line)}
.mx2 thead .stk{z-index:3;background:var(--sunk)}
.mx2 td{white-space:nowrap}
.mx2 th.rc{min-width:118px}
.mx2 td.cell{cursor:pointer;min-width:118px;border-left:1px solid var(--line);vertical-align:top}
.mx2 td.cell:hover,.mx2 td.cell:focus-visible{background:var(--accent-soft)}
.mx2 td.cell.on{background:var(--ok-soft)}
.mx2 td.cell.on:hover{background:var(--accent-soft)}
.mx2 td.cell .plus{color:var(--muted)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.x:hover{color:var(--bad)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 130px 32px;gap:8px;align-items:start}
.crow.h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#crows{display:grid;gap:8px}
.cpick{display:grid;gap:6px;min-width:0}
.apply{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;margin:0}
.apply legend{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 4px}
.apply label{display:flex;gap:8px;align-items:center}
.lgrid{display:grid;grid-template-columns:70px 150px minmax(0,1fr) 90px;gap:6px 8px;align-items:center}
@media (max-width:520px){.lgrid{grid-template-columns:60px minmax(0,1fr)}.lgrid .sp{grid-column:1/-1}}
</style>
